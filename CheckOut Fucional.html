<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout de Compra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f7;
            margin: 0;
            padding: 50px;
        }

        .caixa {
            width: 460px;
            margin: auto;
            background: white;
            padding: 32px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ccc;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        h3 {
            text-align: center;
            color: #444;
            margin: 0 0 18px;
        }

        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            border: none;
            padding: 14px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .pix {
            background: #12b3a6;
        }

        .dinheiro {
            background: #21a844;
        }

        .cartao {
            background: #087df5;
        }

        .parcelado {
            background: #707982;
        }

        .resultado {
            margin-top: 25px;
            background: #f5f6f7;
            border-left: 5px solid #087df5;
            padding: 22px;
            border-radius: 6px;
        }

        .forma {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .total {
            font-size: 23px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="caixa">

        <h1>Checkout de Compra</h1>

        <label>Preço do Produto (R$):</label>
        <input type="number" id="produto" placeholder="Ex: 100,00">

        <label>Valor do Frete (R$):</label>
        <input type="number" id="frete" placeholder="Ex: 15,00">

        <h3>Forma de Pagamento:</h3>

        <div class="botoes">
            <button class="pix" onclick="calcular('PIX')">
                PIX (-10%)
            </button>

            <button class="dinheiro" onclick="calcular('Dinheiro')">
                Dinheiro (-5%)
            </button>

            <button class="cartao" onclick="calcular('Cartão')">
                Cartão à vista
            </button>

            <button class="parcelado" onclick="calcular('Parcelado')">
                Parcelado (+5%)
            </button>
        </div>

        <div class="resultado">
            <div class="forma" id="forma">
                Forma: -
            </div>

            <div class="total" id="total">
                Total: R$ 0.00
            </div>
        </div>

    </div>

    <script>

        function calcular(pagamento) {

            let produto = Number(document.getElementById("produto").value);
            let frete = Number(document.getElementById("frete").value);

            let total = produto + frete;

            if (pagamento == "PIX") {
                total = total * 0.90;
            }

            if (pagamento == "Dinheiro") {
                total = total * 0.95;
            }

            if (pagamento == "Parcelado") {
                total = total * 1.05;
            }

            document.getElementById("forma").innerHTML =
                "Forma: " + pagamento;

            document.getElementById("total").innerHTML =
                "Total: R$ " + total.toFixed(2);
        }

    </script>

</body>
</html>
